name: Run iOS e2e tests

# Reusable: runs the Argent flows against a prebuilt app bundle. Called by `ios.yml`.
on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact holding the packaged .app bundle to test.
        required: true
        type: string
      xcode-version:
        description: >-
          Xcode to run on. Must match the version the app was built with, so the
          simulator runtime matches the SDK.
        required: true
        type: string

jobs:
  e2e:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode-version }}
        run: |
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "Xcode ${XCODE_VERSION} is not installed on this runner. Available:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          echo "Using $XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version

      # Only needed to run the Argent CLI — the app is downloaded, not built.
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download app built by the build workflow
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/app

      - name: Unpack app bundle
        run: |
          tar -xzf "$RUNNER_TEMP/app/app.tar.gz" -C "$RUNNER_TEMP/app"
          APP_PATH=$(find "$RUNNER_TEMP/app" -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Downloaded artifact does not contain an .app" >&2
            ls -la "$RUNNER_TEMP/app" >&2
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Set up iPhone 17 Pro simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 17 Pro \(" | head -1 | grep -oE "[0-9A-Fa-f-]{36}" || true)
          if [ -z "$UDID" ]; then
            echo "iPhone 17 Pro not found, creating one"
            RUNTIME=$(xcrun simctl list runtimes ios -j | jq -r '.runtimes | map(select(.isAvailable)) | last | .identifier')
            UDID=$(xcrun simctl create "iPhone 17 Pro" "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro" "$RUNTIME")
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Disable keyboard intelligence on the simulator
        run: |
          KEYS=(
            KeyboardPrediction
            KeyboardAutocorrection
            KeyboardCheckSpelling
            KeyboardAutocapitalization
            KeyboardPeriodShortcut
            KeyboardCapsLock
            KeyboardContinuousPathEnabled
          )
          for key in "${KEYS[@]}"; do
            xcrun simctl spawn "$SIMULATOR_UDID" defaults write "Apple Global Domain" "$key" -bool false
            xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.Preferences "$key" -bool false
          done
          # Suppress the slide-to-type intro overlay a fresh sim shows on first keyboard use
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.keyboard.preferences \
            DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$SIMULATOR_UDID" defaults read "Apple Global Domain" | grep Keyboard || true

      - name: Install app on simulator
        run: |
          echo "Installing $APP_PATH on $SIMULATOR_UDID"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Install Argent and start the tool-server
        uses: ./.github/actions/argent-server

      - name: Run E2E tests
        run: argent flow run ./.argent/flows --device $SIMULATOR_UDID

      # Interpreting the artifacts:
      # - screen.png taken first, closest to the failure state (software keyboard
      #   still visible = the dismissal never completed).
      # - probe-flow.txt distinguishes wedged from recovered: "ViewInspector RPC
      #   timed out" = the app STILL cannot serve a main-thread read minutes after
      #   the failure (true wedge); a plain "not visible" assert failure = the
      #   tree was readable again (bounded stall that recovered).
      # - sample-app.txt runs WHILE the probe is in flight, so a wedged main
      #   thread is caught parked in the culprit frames.
      # - spindump-system.txt covers the XPC peers (keyboard daemon, backboardd)
      #   in case main is waiting on another process.
      - name: Capture app diagnostics
        if: ${{ !success() }}
        run: |
          DIAG="$RUNNER_TEMP/diagnostics"
          mkdir -p "$DIAG"

          xcrun simctl io "$SIMULATOR_UDID" screenshot "$DIAG/screen.png" || true

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          PID=$(xcrun simctl spawn "$SIMULATOR_UDID" launchctl list 2>/dev/null \
            | awk -v label="UIKitApplication:$BUNDLE_ID" '$3 ~ label {print $1}' | head -1)

          # One-step throwaway flow: reads the UI tree through the same
          # native-devtools path the real flows use. The assert is expected to
          # fail either way; only the failure REASON matters (see above).
          mkdir -p "$RUNNER_TEMP/probe-flow"
          cat > "$RUNNER_TEMP/probe-flow/probe.yaml" <<'EOF'
          steps:
            - assert: { visible: "argent-diagnostic-probe-nonexistent" }
          EOF

          if [ -n "$PID" ] && [ "$PID" != "-" ]; then
            echo "Sampling $BUNDLE_ID (pid $PID) while probing the UI tree"
            sample "$PID" 15 -file "$DIAG/sample-app.txt" &
            SAMPLE_JOB=$!
            argent flow run "$RUNNER_TEMP/probe-flow" --device "$SIMULATOR_UDID" \
              2>&1 | tee "$DIAG/probe-flow.txt" || true
            wait "$SAMPLE_JOB" || true
          else
            echo "$BUNDLE_ID is not running; nothing to sample" | tee "$DIAG/app-not-running.txt"
            argent flow run "$RUNNER_TEMP/probe-flow" --device "$SIMULATOR_UDID" \
              2>&1 | tee "$DIAG/probe-flow.txt" || true
          fi

          sudo spindump -notarget 5 20 -file "$DIAG/spindump-system.txt" || true

      - name: Upload diagnostics
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-diagnostics-${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: ignore

      # The tool-server log also carries the device backend's stderr
      # (`[sim <udid>]` lines), where a failed connection to the simulator is
      # explained.
      - name: Print Argent tool-server log
        if: ${{ !success() }}
        run: cat "$ARGENT_SERVER_LOG" 2>/dev/null || echo "no Argent tool-server log"
