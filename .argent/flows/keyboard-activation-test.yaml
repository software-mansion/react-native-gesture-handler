# Android only: a hardware Enter presses each kind of focused gesture-handler
# control once, as a key with no pointer, where a tap would land. Tab moves
# focus in view order, so after the taps and the console clear the counts below
# reach the inner default Pressable, then each control after it.
steps:
  - echo: Launching Expo Example
  - launch: com.example.ExpoExample
  - await: { visible: { text: "Empty Example" }, timeout: 15000 }
  - when: { platform: android }
    steps:
      - echo: "On the Home list, search for the keyboard activation example"
      - type: { text: "keyboard activation", into: { id: "search-examples" } }
      - await: { visible: { text: "Keyboard activation" } }
      - echo: "Tap the example to open it"
      - tap: { text: "Keyboard activation" }
      - await: { visible: { id: "scaled-touchable" } }
      - await: { idle: true }

      - echo: "Clear console"
      - await: { visible: { id: "open-console-button" } }
      - tap: { id: "open-console-button" }
      - await: { visible: { id: "clear-console-button" } }
      - tap: { id: "clear-console-button" }
      - tap: { id: "close-console-button" }
      - await: { hidden: { id: "close-console-button" } }
      - await: { idle: true }

      - echo: "Tap the inner state-machine and legacy Pressables, the RectButton and the scaled Touchable"
      - tap: { id: "stateful-inner" }
      - tap: { id: "legacy-inner" }
      - tap: { id: "rect-button" }
      - tap: { id: "scaled-touchable" }
      - await: { idle: true }

      - echo: "Each tap presses only its own control"
      - tap: { id: "open-console-button" }
      - await: { idle: true }
      - await: { visible: { id: "close-console-button" } }
      - assert: { visible: { text: { matches: '^3\. \[stateful inner\] onPress$' } } }
      - assert: { visible: { text: { matches: '^6\. \[legacy inner\] onPress$' } } }
      - assert: { visible: { text: { matches: '^7\. \[rect button\] onBegin TOUCH with 1 pointers$' } } }
      - assert: { visible: { text: { matches: '^9\. \[scaled\] tap$' } } }
      - assert: { hidden: { text: "outer]" } }

      - echo: "Clear console"
      - tap: { id: "clear-console-button" }
      - tap: { id: "close-console-button" }
      - await: { hidden: { id: "close-console-button" } }
      - await: { idle: true }

      - echo: "Tab to the inner default Pressable, which no pointer has touched, and press Enter"
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: enter }
      - echo: "Tab to the state-machine Pressable whose inner was tapped, and press Enter"
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: enter }
      - echo: "Tab past its inner to the legacy Pressable whose inner was tapped, and press Enter"
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: enter }
      - echo: "Each Enter presses its Pressable once, the parent of a tapped one included"
      - tap: { id: "open-console-button" }
      - await: { idle: true }
      - await: { visible: { id: "close-console-button" } }
      - assert: { visible: { text: { matches: '^10\. \[pressable inner\] onPressIn$' } } }
      - assert: { visible: { text: { matches: '^11\. \[pressable inner\] onPressOut$' } } }
      - assert: { visible: { text: { matches: '^12\. \[pressable inner\] onPress$' } } }
      - assert: { visible: { text: { matches: '^13\. \[stateful outer\] onPressIn$' } } }
      - assert: { visible: { text: { matches: '^14\. \[stateful outer\] onPressOut$' } } }
      - assert: { visible: { text: { matches: '^15\. \[stateful outer\] onPress$' } } }
      - assert: { visible: { text: { matches: '^16\. \[legacy outer\] onPressIn$' } } }
      - assert: { visible: { text: { matches: '^17\. \[legacy outer\] onPressOut$' } } }
      - assert: { visible: { text: { matches: '^18\. \[legacy outer\] onPress$' } } }
      - assert: { hidden: { text: "[pressable outer]" } }
      - assert: { hidden: { text: { matches: '^19\. ' } } }

      - echo: "Clear console"
      - tap: { id: "clear-console-button" }
      - tap: { id: "close-console-button" }
      - await: { hidden: { id: "close-console-button" } }
      - await: { idle: true }

      - echo: "Tab to the RectButton, the seventh control, and press Enter"
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: enter }
      - echo: "Tab to the scaled Touchable and press Enter"
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: enter }

      - echo: "Enter reports a key with no pointer, and lands where the tap did"
      - tap: { id: "open-console-button" }
      - await: { idle: true }
      - await: { visible: { id: "close-console-button" } }
      - assert: { visible: { text: { matches: '^19\. \[rect button\] onBegin KEY with 0 pointers$' } } }
      - assert: { visible: { text: { matches: '^20\. \[rect button\] onPress$' } } }
      - assert: { visible: { text: { matches: '^21\. \[scaled\] key press lands on the tap$' } } }
      - assert: { hidden: { text: { matches: '^22\. ' } } }

      - echo: "Clear console"
      - tap: { id: "clear-console-button" }
      - tap: { id: "close-console-button" }
      - await: { hidden: { id: "close-console-button" } }
      - await: { idle: true }

      - echo: "Tap the input inside the ScrollView, so the soft keyboard is up for it, then Tab to the Pressable beside it and press Enter"
      - tap: { id: "typing-input" }
      - await: { idle: true }
      - tool: keyboard
        args: { key: tab }
      - tool: keyboard
        args: { key: enter }

      - echo: "A key press is no tap dismissing the keyboard, so it presses the Pressable once"
      - tap: { id: "open-console-button" }
      - await: { idle: true }
      - await: { visible: { id: "close-console-button" } }
      - assert: { visible: { text: { matches: '^22\. \[typing pressable\] onPressIn$' } } }
      - assert: { visible: { text: { matches: '^23\. \[typing pressable\] onPressOut$' } } }
      - assert: { visible: { text: { matches: '^24\. \[typing pressable\] onPress$' } } }
      - assert: { hidden: { text: { matches: '^25\. ' } } }
